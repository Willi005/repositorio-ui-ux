" fill="#1F2933">Save or clear the profile</text><path d="M980 206 V270" fill="none" stroke="#9AA7B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="855.0" y="270" width="250" height="52" rx="3" fill="#E2CCFF"/><text x="980" y="301.5" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2933">Privacy policy</text><path d="M980 322 V354" fill="none" stroke="#9AA7B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="855.0" y="354" width="250" height="52" rx="3" fill="#FFC7C2"/><text x="980" y="385.5" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2933">Switch session history</text><path d="M980 406 V438" fill="none" stroke="#9AA7B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="855.0" y="438" width="250" height="52" rx="3" fill="#FFC7C2"/><text x="980" y="469.5" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2933">Delete all session data</text><path d="M980 490 V522" fill="none" stroke="#9AA7B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="855.0" y="522" width="250" height="52" rx="3" fill="#FFC7C2"/><text x="980" y="553.5" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2933">Go to my assistant</text><rect x="245.0" y="798" width="22" height="14" rx="2" fill="#FFD12E"/><text x="277.0" y="810" text-anchor="start" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7A85">Main section</text><rect x="395.0" y="798" width="22" height="14" rx="2" fill="#E2CCFF"/><text x="427.0" y="810" text-anchor="start" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7A85">Screen</text><rect x="515.0" y="798" width="22" height="14" rx="2" fill="#FFC7C2"/><text x="547.0" y="810" text-anchor="start" font-family="Liberation Sans, Arial, sans-