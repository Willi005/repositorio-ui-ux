<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1620" viewBox="0 0 1800 1620" role="img"><title>Comprender qué hacer con su licencia, paso a paso y sin sentirse juzgado.</title><style>text {font-family: Liberation Sans, Arial, sans-serif;}</style><rect x="0" y="0" width="1800" height="1620" rx="0" fill="#F7FAFB" stroke="none"/><rect x="0" y="0" width="1800" height="163" rx="0" fill="#14344A" stroke="none"/><text x="40" y="48.0" font-size="36" fill="#FFFFFF" font-weight="700">Customer Journey · Benjamin</text><text x="40" y="83.0" font-size="24" fill="#CDE6EE" font-weight="400">24 años · Vendedor de retail · Valdivia · Primera licencia médica</text><text x="40" y="120.0" font-size="26" fill="#FFFFFF" font-weight="400">Comprender qué hacer con su licencia, paso a paso y sin sentirse juzgado.</text><text x="40" y="150.0" font-size="18" fill="#CDE6EE" font-weight="400">RECORRIDO PROPUESTO · HIPÓTESIS PARA VALIDAR · 05 OCT 2026</text><text x="30" y="198.0" font-size="19" fill="#087E8B" font-weight="700">EMOCIONES</text><text x="30" y="237.0" font-size="18" fill="#14344A" font-weight="400">Satisfacción</text><text x="30" y="413.0" font-size="18" fill="#14344A" font-weight="400">Frustración</text><text x="180" y="188.0" font-size="19" fill="#14344A" font-weight="400">Escala cualitativa: −2 a +2; posiciones estimadas, sin medición de usuarios.</text><line x1="180" y1="402" x2="1760" y2="402" stroke="#D4E0E6" stroke-dasharray="5 6"/><line x1="180" y1="362" x2="1760" y2="362" stroke="#D4E0E6" stroke-dasharray="5 6"/><line x1="180" y1="322" x2="1760" y2="322" stroke="#D4E0E6" stroke-dasharray="5 6"/><line x1="180" y1="282" x2="1760" y2="282" stroke="#D4E0E6" stroke-dasharray="5 6"/><line x1="180" y1="242" x2="1760" y2="242" stroke="#D4E0E6" stroke-dasharray="5 6"/><polyline points="278,362 476,362 674,322 872,362 1070,282 1268,322 1466,282 1664,282" fill="none" stroke="#087E8B" stroke-width="5"/><circle cx="278" cy="362" r="10" fill="#087E8B"/><text x="193" y="340.0" font-size="19" fill="#14344A" font-weight="700">Inseguridad</text><circle cx="476" cy="362" r="10" fill="#087E8B"/><text x="391" y="340.0" font-size="19" fill="#14344A" font-weight="700">Expectativa</text><circle cx="674" cy="322" r="10" fill="#087E8B"/><text x="589" y="300.0" font-size="19" fill="#14344A" font-weight="700">Interés</text><circle cx="872" cy="362" r="10" fill="#087E8B"/><text x="787" y="340.0" font-size="19" fill="#14344A" font-weight="700">Confusión</text><circle cx="1070" cy="282" r="10" fill="#087E8B"/><text x="985" y="260.0" font-size="19" fill="#14344A" font-weight="700">Claridad</text><circle cx="1268" cy="322" r="10" fill="#087E8B"/><text x="1183" y="300.0" font-size="19" fill="#14344A" font-weight="700">Cautela</text><circle cx="1466" cy="282" r="10" fill="#087E8B"/><text x="1381" y="260.0" font-size="19" fill="#14344A" font-weight="700">Alivio parcial</text><circle cx="1664" cy="282" r="10" fill="#087E8B"/><text x="1579" y="260.0" font-size="19" fill="#14344A" font-weight="700">Autonomía</text><circle cx="674" cy="322" r="19" fill="none" stroke="#AF492C" stroke-width="4"/><text x="180" y="445.0" font-size="22" fill="#AF492C" font-weight="700">Momento clave: reconocer el problema y la institución competente antes de derivar.</text><text x="30" y="490.0" font-size="19" fill="#087E8B" font-weight="700">ACCIONES Y</text><text x="30" y="516.0" font-size="19" fill="#087E8B" font-weight="700">CONTACTOS</text><rect x="180" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="190" y="489.0" font-size="21" fill="#14344A" font-weight="700">1. Recibir la</text><text x="190" y="515.25" font-size="21" fill="#14344A" font-weight="700">licencia</text><text x="190" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Profesional de</text><text x="190" y="591.75" font-size="19" fill="#087E8B" font-weight="400">salud · documento</text><text x="190" y="615.5" font-size="19" fill="#087E8B" font-weight="400">o aviso</text><text x="190" y="679.0" font-size="20" fill="#14344A" font-weight="400">Reúne la</text><text x="190" y="704.0" font-size="20" fill="#14344A" font-weight="400">información</text><text x="190" y="729.0" font-size="20" fill="#14344A" font-weight="400">disponible sobre</text><text x="190" y="754.0" font-size="20" fill="#14344A" font-weight="400">su primera</text><text x="190" y="779.0" font-size="20" fill="#14344A" font-weight="400">licencia.</text><rect x="378" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="388" y="489.0" font-size="21" fill="#14344A" font-weight="700">2. Encontrar una</text><text x="388" y="515.25" font-size="21" fill="#14344A" font-weight="700">guía</text><text x="388" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Buscador · celular ·</text><text x="388" y="591.75" font-size="19" fill="#087E8B" font-weight="400">opción «Licencia</text><text x="388" y="615.5" font-size="19" fill="#087E8B" font-weight="400">médica»</text><text x="388" y="679.0" font-size="20" fill="#14344A" font-weight="400">Busca una</text><text x="388" y="704.0" font-size="20" fill="#14344A" font-weight="400">explicación</text><text x="388" y="729.0" font-size="20" fill="#14344A" font-weight="400">sencilla y consulta</text><text x="388" y="754.0" font-size="20" fill="#14344A" font-weight="400">sin cuenta.</text><rect x="576" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="586" y="489.0" font-size="21" fill="#14344A" font-weight="700">3. Identificar el</text><text x="586" y="515.25" font-size="21" fill="#14344A" font-weight="700">problema</text><text x="586" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Asistente ·</text><text x="586" y="591.75" font-size="19" fill="#087E8B" font-weight="400">preguntas guiadas</text><text x="586" y="679.0" font-size="20" fill="#14344A" font-weight="400">Identifica</text><text x="586" y="704.0" font-size="20" fill="#14344A" font-weight="400">problema,</text><text x="586" y="729.0" font-size="20" fill="#14344A" font-weight="400">institución y</text><text x="586" y="754.0" font-size="20" fill="#14344A" font-weight="400">estado, si los</text><text x="586" y="779.0" font-size="20" fill="#14344A" font-weight="400">conoce.</text><rect x="774" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="784" y="489.0" font-size="21" fill="#14344A" font-weight="700">4. Entender el</text><text x="784" y="515.25" font-size="21" fill="#14344A" font-weight="700">siguiente paso</text><text x="784" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Respuesta · ficha</text><text x="784" y="591.75" font-size="19" fill="#087E8B" font-weight="400">oficial competente</text><text x="784" y="679.0" font-size="20" fill="#14344A" font-weight="400">Lee los pasos y la</text><text x="784" y="704.0" font-size="20" fill="#14344A" font-weight="400">fuente; reconoce</text><text x="784" y="729.0" font-size="20" fill="#14344A" font-weight="400">los datos que</text><text x="784" y="754.0" font-size="20" fill="#14344A" font-weight="400">faltan.</text><rect x="972" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="982" y="489.0" font-size="21" fill="#14344A" font-weight="700">5. Preparar la</text><text x="982" y="515.25" font-size="21" fill="#14344A" font-weight="700">gestión</text><text x="982" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Checklist · celular ·</text><text x="982" y="591.75" font-size="19" fill="#087E8B" font-weight="400">enlace oficial</text><text x="982" y="679.0" font-size="20" fill="#14344A" font-weight="400">Ordena</text><text x="982" y="704.0" font-size="20" fill="#14344A" font-weight="400">antecedentes sin</text><text x="982" y="729.0" font-size="20" fill="#14344A" font-weight="400">subir información</text><text x="982" y="754.0" font-size="20" fill="#14344A" font-weight="400">clínica al</text><text x="982" y="779.0" font-size="20" fill="#14344A" font-weight="400">asistente.</text><rect x="1170" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1180" y="489.0" font-size="21" fill="#14344A" font-weight="700">6. Elegir a quién</text><text x="1180" y="515.25" font-size="21" fill="#14344A" font-weight="700">acudir</text><text x="1180" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Derivación</text><text x="1180" y="591.75" font-size="19" fill="#087E8B" font-weight="400">explicada · canal</text><text x="1180" y="615.5" font-size="19" fill="#087E8B" font-weight="400">oficial</text><text x="1180" y="679.0" font-size="20" fill="#14344A" font-weight="400">Abre la institución</text><text x="1180" y="704.0" font-size="20" fill="#14344A" font-weight="400">pertinente según</text><text x="1180" y="729.0" font-size="20" fill="#14344A" font-weight="400">el problema y la</text><text x="1180" y="754.0" font-size="20" fill="#14344A" font-weight="400">etapa.</text><rect x="1368" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1378" y="489.0" font-size="21" fill="#14344A" font-weight="700">7. Realizar el</text><text x="1378" y="515.25" font-size="21" fill="#14344A" font-weight="700">paso oficial</text><text x="1378" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Institución</text><text x="1378" y="591.75" font-size="19" fill="#087E8B" font-weight="400">competente · web,</text><text x="1378" y="615.5" font-size="19" fill="#087E8B" font-weight="400">teléfono u oficina</text><text x="1378" y="679.0" font-size="20" fill="#14344A" font-weight="400">Consulta o</text><text x="1378" y="704.0" font-size="20" fill="#14344A" font-weight="400">gestiona en el</text><text x="1378" y="729.0" font-size="20" fill="#14344A" font-weight="400">canal oficial que</text><text x="1378" y="754.0" font-size="20" fill="#14344A" font-weight="400">corresponda.</text><rect x="1566" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1576" y="489.0" font-size="21" fill="#14344A" font-weight="700">8. Revisar los</text><text x="1576" y="515.25" font-size="21" fill="#14344A" font-weight="700">pendientes</text><text x="1576" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Resumen local ·</text><text x="1576" y="591.75" font-size="19" fill="#087E8B" font-weight="400">comprobante o</text><text x="1576" y="615.5" font-size="19" fill="#087E8B" font-weight="400">respuesta oficial</text><text x="1576" y="679.0" font-size="20" fill="#14344A" font-weight="400">Revisa lo</text><text x="1576" y="704.0" font-size="20" fill="#14344A" font-weight="400">pendiente y pide</text><text x="1576" y="729.0" font-size="20" fill="#14344A" font-weight="400">ayuda ante dudas</text><text x="1576" y="754.0" font-size="20" fill="#14344A" font-weight="400">en una</text><text x="1576" y="779.0" font-size="20" fill="#14344A" font-weight="400">notificación.</text><rect x="180" y="856" width="386" height="56" rx="6" fill="#087E8B" stroke="none"/><text x="192" y="891.0" font-size="23" fill="#FFFFFF" font-weight="700">Búsqueda de orientación</text><rect x="576" y="856" width="386" height="56" rx="6" fill="#087E8B" stroke="none"/><text x="588" y="891.0" font-size="23" fill="#FFFFFF" font-weight="700">Comprensión y verificación</text><rect x="972" y="856" width="386" height="56" rx="6" fill="#087E8B" stroke="none"/><text x="984" y="891.0" font-size="23" fill="#FFFFFF" font-weight="700">Decisión y derivación</text><rect x="1368" y="856" width="386" height="56" rx="6" fill="#087E8B" stroke="none"/><text x="1380" y="891.0" font-size="23" fill="#FFFFFF" font-weight="700">Continuidad del caso</text><text x="22" y="958.0" font-size="17" fill="#087E8B" font-weight="700">VALOR</text><rect x="180" y="928" width="386" height="188" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="196" y="959.0" font-size="23" fill="#14344A" font-weight="400">Esperado: una explicación sin</text><text x="196" y="987.75" font-size="23" fill="#14344A" font-weight="400">juicio. Propuesto: acceso por</text><text x="196" y="1016.5" font-size="23" fill="#14344A" font-weight="400">situación y lenguaje cotidiano.</text><rect x="576" y="928" width="386" height="188" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="592" y="959.0" font-size="23" fill="#14344A" font-weight="400">Esperado: saber qué hacer y por</text><text x="592" y="987.75" font-size="23" fill="#14344A" font-weight="400">qué. Propuesto: preguntas de</text><text x="592" y="1016.5" font-size="23" fill="#14344A" font-weight="400">clasificación, pasos breves y</text><text x="592" y="1045.25" font-size="23" fill="#14344A" font-weight="400">fuente competente.</text><rect x="972" y="928" width="386" height="188" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="988" y="959.0" font-size="23" fill="#14344A" font-weight="400">Esperado: llegar a la institución</text><text x="988" y="987.75" font-size="23" fill="#14344A" font-weight="400">correcta. Propuesto: checklist y</text><text x="988" y="1016.5" font-size="23" fill="#14344A" font-weight="400">destino explicado según problema</text><text x="988" y="1045.25" font-size="23" fill="#14344A" font-weight="400">y etapa.</text><rect x="1368" y="928" width="386" height="188" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1384" y="959.0" font-size="23" fill="#14344A" font-weight="400">Esperado: poder continuar solo.</text><text x="1384" y="987.75" font-size="23" fill="#14344A" font-weight="400">Propuesto: resumen y pendientes</text><text x="1384" y="1016.5" font-size="23" fill="#14344A" font-weight="400">sin afirmar que su licencia fue</text><text x="1384" y="1045.25" font-size="23" fill="#14344A" font-weight="400">aprobada.</text><text x="22" y="1162.0" font-size="17" fill="#087E8B" font-weight="700">BARRERAS</text><rect x="180" y="1132" width="386" height="155" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="196" y="1163.0" font-size="23" fill="#14344A" font-weight="400">Primera experiencia laboral;</text><text x="196" y="1191.75" font-size="23" fill="#14344A" font-weight="400">términos desconocidos y temor a</text><text x="196" y="1220.5" font-size="23" fill="#14344A" font-weight="400">preguntar.</text><rect x="576" y="1132" width="386" height="155" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="592" y="1163.0" font-size="23" fill="#14344A" font-weight="400">Institución, origen y estado de la</text><text x="592" y="1191.75" font-size="23" fill="#14344A" font-weight="400">licencia desconocidos; siglas y</text><text x="592" y="1220.5" font-size="23" fill="#14344A" font-weight="400">mensajes técnicos.</text><rect x="972" y="1132" width="386" height="155" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="988" y="1163.0" font-size="23" fill="#14344A" font-weight="400">Requisitos distintos por situación;</text><text x="988" y="1191.75" font-size="23" fill="#14344A" font-weight="400">riesgo de entregar datos clínicos</text><text x="988" y="1220.5" font-size="23" fill="#14344A" font-weight="400">innecesarios.</text><rect x="1368" y="1132" width="386" height="155" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1384" y="1163.0" font-size="23" fill="#14344A" font-weight="400">Notificaciones difíciles de</text><text x="1384" y="1191.75" font-size="23" fill="#14344A" font-weight="400">interpretar y ausencia de una</text><text x="1384" y="1220.5" font-size="23" fill="#14344A" font-weight="400">resolución inmediata.</text><text x="22" y="1333.0" font-size="17" fill="#087E8B" font-weight="700">OPORTUNIDADES</text><rect x="180" y="1303" width="386" height="194" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="196" y="1334.0" font-size="23" fill="#14344A" font-weight="400">Inicio «Necesito entender mi</text><text x="196" y="1362.75" font-size="23" fill="#14344A" font-weight="400">licencia»; explicación sencilla de</text><text x="196" y="1391.5" font-size="23" fill="#14344A" font-weight="400">los límites del servicio.</text><rect x="576" y="1303" width="386" height="194" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="592" y="1334.0" font-size="23" fill="#14344A" font-weight="400">Una pregunta por paso; definir</text><text x="592" y="1362.75" font-size="23" fill="#14344A" font-weight="400">siglas en contexto y señalar datos</text><text x="592" y="1391.5" font-size="23" fill="#14344A" font-weight="400">faltantes.</text><rect x="972" y="1303" width="386" height="194" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="988" y="1334.0" font-size="23" fill="#14344A" font-weight="400">Derivar según competencia;</text><text x="988" y="1362.75" font-size="23" fill="#14344A" font-weight="400">explicar documentos sin pedir</text><text x="988" y="1391.5" font-size="23" fill="#14344A" font-weight="400">diagnóstico ni expediente médico.</text><rect x="1368" y="1303" width="386" height="194" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1384" y="1334.0" font-size="23" fill="#14344A" font-weight="400">Lista de pendientes; distinguir</text><text x="1384" y="1362.75" font-size="23" fill="#14344A" font-weight="400">respuesta orientativa de estado</text><text x="1384" y="1391.5" font-size="23" fill="#14344A" font-weight="400">oficial de la licencia.</text><text x="40" y="1540.0" font-size="22" fill="#14344A" font-weight="400">Lectura: el alivio final expresa una expectativa de control; no garantiza pago, aprobación ni resolución favorable.</text><text x="40" y="1577.0" font-size="20" fill="#14344A" font-weight="400">Adaptación de la plantilla del docente: acciones, emociones, valor, barreras, oportunidades y momento clave.</text></svg>