<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1620" viewBox="0 0 1800 1620" role="img"><title>Entender su finiquito y preparar una decisión informada con apoyo oficial.</title><style>text {font-family: Liberation Sans, Arial, sans-serif;}</style><rect x="0" y="0" width="1800" height="1620" rx="0" fill="#F7FAFB" stroke="none"/><rect x="0" y="0" width="1800" height="163" rx="0" fill="#14344A" stroke="none"/><text x="40" y="48.0" font-size="36" fill="#FFFFFF" font-weight="700">Customer Journey · Joseph</text><text x="40" y="83.0" font-size="24" fill="#CDE6EE" font-weight="400">42 años · Bodeguero · Concepción · Despido después de ocho años</text><text x="40" y="120.0" font-size="26" fill="#FFFFFF" font-weight="400">Entender su finiquito y preparar una decisión informada con apoyo oficial.</text><text x="40" y="150.0" font-size="18" fill="#CDE6EE" font-weight="400">RECORRIDO PROPUESTO · HIPÓTESIS PARA VALIDAR · 05 OCT 2026</text><text x="30" y="198.0" font-size="19" fill="#087E8B" font-weight="700">EMOCIONES</text><text x="30" y="237.0" font-size="18" fill="#14344A" font-weight="400">Satisfacción</text><text x="30" y="413.0" font-size="18" fill="#14344A" font-weight="400">Frustración</text><text x="180" y="188.0" font-size="19" fill="#14344A" font-weight="400">Escala cualitativa: −2 a +2; posiciones estimadas, sin medición de usuarios.</text><line x1="180" y1="402" x2="1760" y2="402" stroke="#D4E0E6" stroke-dasharray="5 6"/><line x1="180" y1="362" x2="1760" y2="362" stroke="#D4E0E6" stroke-dasharray="5 6"/><line x1="180" y1="322" x2="1760" y2="322" stroke="#D4E0E6" stroke-dasharray="5 6"/><line x1="180" y1="282" x2="1760" y2="282" stroke="#D4E0E6" stroke-dasharray="5 6"/><line x1="180" y1="242" x2="1760" y2="242" stroke="#D4E0E6" stroke-dasharray="5 6"/><polyline points="278,402 476,362 674,322 872,362 1070,282 1268,322 1466,282 1664,282" fill="none" stroke="#087E8B" stroke-width="5"/><circle cx="278" cy="402" r="10" fill="#087E8B"/><text x="193" y="380.0" font-size="19" fill="#14344A" font-weight="700">Temor</text><circle cx="476" cy="362" r="10" fill="#087E8B"/><text x="391" y="340.0" font-size="19" fill="#14344A" font-weight="700">Esperanza</text><circle cx="674" cy="322" r="10" fill="#087E8B"/><text x="589" y="300.0" font-size="19" fill="#14344A" font-weight="700">Interés</text><circle cx="872" cy="362" r="10" fill="#087E8B"/><text x="787" y="340.0" font-size="19" fill="#14344A" font-weight="700">Duda</text><circle cx="1070" cy="282" r="10" fill="#087E8B"/><text x="985" y="260.0" font-size="19" fill="#14344A" font-weight="700">Claridad</text><circle cx="1268" cy="322" r="10" fill="#087E8B"/><text x="1183" y="300.0" font-size="19" fill="#14344A" font-weight="700">Cautela</text><circle cx="1466" cy="282" r="10" fill="#087E8B"/><text x="1381" y="260.0" font-size="19" fill="#14344A" font-weight="700">Alivio parcial</text><circle cx="1664" cy="282" r="10" fill="#087E8B"/><text x="1579" y="260.0" font-size="19" fill="#14344A" font-weight="700">Control</text><circle cx="872" cy="362" r="19" fill="none" stroke="#AF492C" stroke-width="4"/><text x="180" y="445.0" font-size="22" fill="#AF492C" font-weight="700">Momento clave: reconocer una verificación incompleta y buscar apoyo antes de decidir.</text><text x="30" y="490.0" font-size="19" fill="#087E8B" font-weight="700">ACCIONES Y</text><text x="30" y="516.0" font-size="19" fill="#087E8B" font-weight="700">CONTACTOS</text><rect x="180" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="190" y="489.0" font-size="21" fill="#14344A" font-weight="700">1. Recibir el</text><text x="190" y="515.25" font-size="21" fill="#14344A" font-weight="700">finiquito</text><text x="190" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Empleador ·</text><text x="190" y="591.75" font-size="19" fill="#087E8B" font-weight="400">documento físico o</text><text x="190" y="615.5" font-size="19" fill="#087E8B" font-weight="400">PDF</text><text x="190" y="679.0" font-size="20" fill="#14344A" font-weight="400">Lee y marca los</text><text x="190" y="704.0" font-size="20" fill="#14344A" font-weight="400">conceptos del</text><text x="190" y="729.0" font-size="20" fill="#14344A" font-weight="400">finiquito que no</text><text x="190" y="754.0" font-size="20" fill="#14344A" font-weight="400">entiende.</text><rect x="378" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="388" y="489.0" font-size="21" fill="#14344A" font-weight="700">2. Encontrar</text><text x="388" y="515.25" font-size="21" fill="#14344A" font-weight="700">orientación</text><text x="388" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Buscador · celular ·</text><text x="388" y="591.75" font-size="19" fill="#087E8B" font-weight="400">inicio del asistente</text><text x="388" y="679.0" font-size="20" fill="#14344A" font-weight="400">Busca ayuda</text><text x="388" y="704.0" font-size="20" fill="#14344A" font-weight="400">gratuita y elige</text><text x="388" y="729.0" font-size="20" fill="#14344A" font-weight="400">«Finiquito».</text><rect x="576" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="586" y="489.0" font-size="21" fill="#14344A" font-weight="700">3. Explicar la</text><text x="586" y="515.25" font-size="21" fill="#14344A" font-weight="700">situación</text><text x="586" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Asistente · celular ·</text><text x="586" y="591.75" font-size="19" fill="#087E8B" font-weight="400">preguntas guiadas</text><text x="586" y="679.0" font-size="20" fill="#14344A" font-weight="400">Indica fechas y</text><text x="586" y="704.0" font-size="20" fill="#14344A" font-weight="400">conceptos sin</text><text x="586" y="729.0" font-size="20" fill="#14344A" font-weight="400">entregar su</text><text x="586" y="754.0" font-size="20" fill="#14344A" font-weight="400">identificación.</text><rect x="774" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="784" y="489.0" font-size="21" fill="#14344A" font-weight="700">4. Contrastar el</text><text x="784" y="515.25" font-size="21" fill="#14344A" font-weight="700">respaldo</text><text x="784" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Respuesta ·</text><text x="784" y="591.75" font-size="19" fill="#087E8B" font-weight="400">enlaces oficiales</text><text x="784" y="615.5" font-size="19" fill="#087E8B" font-weight="400">DT/BCN</text><text x="784" y="679.0" font-size="20" fill="#14344A" font-weight="400">Abre la fuente;</text><text x="784" y="704.0" font-size="20" fill="#14344A" font-weight="400">reconoce que</text><text x="784" y="729.0" font-size="20" fill="#14344A" font-weight="400">faltan datos para</text><text x="784" y="754.0" font-size="20" fill="#14344A" font-weight="400">confirmar el</text><text x="784" y="779.0" font-size="20" fill="#14344A" font-weight="400">monto.</text><rect x="972" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="982" y="489.0" font-size="21" fill="#14344A" font-weight="700">5. Preparar la</text><text x="982" y="515.25" font-size="21" fill="#14344A" font-weight="700">consulta</text><text x="982" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Resumen y lista de</text><text x="982" y="591.75" font-size="19" fill="#087E8B" font-weight="400">antecedentes ·</text><text x="982" y="615.5" font-size="19" fill="#087E8B" font-weight="400">celular</text><text x="982" y="679.0" font-size="20" fill="#14344A" font-weight="400">Guarda preguntas</text><text x="982" y="704.0" font-size="20" fill="#14344A" font-weight="400">y antecedentes</text><text x="982" y="729.0" font-size="20" fill="#14344A" font-weight="400">para una consulta</text><text x="982" y="754.0" font-size="20" fill="#14344A" font-weight="400">humana.</text><rect x="1170" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1180" y="489.0" font-size="21" fill="#14344A" font-weight="700">6. Elegir</text><text x="1180" y="515.25" font-size="21" fill="#14344A" font-weight="700">atención oficial</text><text x="1180" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Ficha de derivación</text><text x="1180" y="591.75" font-size="19" fill="#087E8B" font-weight="400">· DT · teléfono u</text><text x="1180" y="615.5" font-size="19" fill="#087E8B" font-weight="400">oficina</text><text x="1180" y="679.0" font-size="20" fill="#14344A" font-weight="400">Elige el canal de la</text><text x="1180" y="704.0" font-size="20" fill="#14344A" font-weight="400">DT y revisa sus</text><text x="1180" y="729.0" font-size="20" fill="#14344A" font-weight="400">requisitos.</text><rect x="1368" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1378" y="489.0" font-size="21" fill="#14344A" font-weight="700">7. Solicitar</text><text x="1378" y="515.25" font-size="21" fill="#14344A" font-weight="700">orientación</text><text x="1378" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Atención de la DT ·</text><text x="1378" y="591.75" font-size="19" fill="#087E8B" font-weight="400">canal oficial</text><text x="1378" y="679.0" font-size="20" fill="#14344A" font-weight="400">Pide orientación y</text><text x="1378" y="704.0" font-size="20" fill="#14344A" font-weight="400">presenta sus</text><text x="1378" y="729.0" font-size="20" fill="#14344A" font-weight="400">antecedentes en</text><text x="1378" y="754.0" font-size="20" fill="#14344A" font-weight="400">el canal oficial.</text><rect x="1566" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1576" y="489.0" font-size="21" fill="#14344A" font-weight="700">8. Retomar la</text><text x="1576" y="515.25" font-size="21" fill="#14344A" font-weight="700">decisión</text><text x="1576" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Resumen local ·</text><text x="1576" y="591.75" font-size="19" fill="#087E8B" font-weight="400">documento · ayuda</text><text x="1576" y="615.5" font-size="19" fill="#087E8B" font-weight="400">oficial</text><text x="1576" y="679.0" font-size="20" fill="#14344A" font-weight="400">Actualiza los</text><text x="1576" y="704.0" font-size="20" fill="#14344A" font-weight="400">pendientes y toma</text><text x="1576" y="729.0" font-size="20" fill="#14344A" font-weight="400">su propia decisión.</text><rect x="180" y="856" width="386" height="56" rx="6" fill="#087E8B" stroke="none"/><text x="192" y="891.0" font-size="23" fill="#FFFFFF" font-weight="700">Búsqueda de orientación</text><rect x="576" y="856" width="386" height="56" rx="6" fill="#087E8B" stroke="none"/><text x="588" y="891.0" font-size="23" fill="#FFFFFF" font-weight="700">Comprensión y verificación</text><rect x="972" y="856" width="386" height="56" rx="6" fill="#087E8B" stroke="none"/><text x="984" y="891.0" font-size="23" fill="#FFFFFF" font-weight="700">Decisión y derivación</text><rect x="1368" y="856" width="386" height="56" rx="6" fill="#087E8B" stroke="none"/><text x="1380" y="891.0" font-size="23" fill="#FFFFFF" font-weight="700">Continuidad del caso</text><text x="22" y="958.0" font-size="17" fill="#087E8B" font-weight="700">VALOR</text><rect x="180" y="928" width="386" height="188" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="196" y="959.0" font-size="23" fill="#14344A" font-weight="400">Esperado: ayuda gratuita y</text><text x="196" y="987.75" font-size="23" fill="#14344A" font-weight="400">comprensible. Propuesto: entrada</text><text x="196" y="1016.5" font-size="23" fill="#14344A" font-weight="400">por finiquito y explicación de quién</text><text x="196" y="1045.25" font-size="23" fill="#14344A" font-weight="400">respalda la orientación.</text><rect x="576" y="928" width="386" height="188" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="592" y="959.0" font-size="23" fill="#14344A" font-weight="400">Esperado: entender conceptos y</text><text x="592" y="987.75" font-size="23" fill="#14344A" font-weight="400">su fundamento. Propuesto:</text><text x="592" y="1016.5" font-size="23" fill="#14344A" font-weight="400">explicación por concepto, fuentes</text><text x="592" y="1045.25" font-size="23" fill="#14344A" font-weight="400">y datos que aún faltan.</text><rect x="972" y="928" width="386" height="188" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="988" y="959.0" font-size="23" fill="#14344A" font-weight="400">Esperado: saber cómo pedir</text><text x="988" y="987.75" font-size="23" fill="#14344A" font-weight="400">ayuda. Propuesto: resumen de</text><text x="988" y="1016.5" font-size="23" fill="#14344A" font-weight="400">preguntas y derivación a la DT</text><text x="988" y="1045.25" font-size="23" fill="#14344A" font-weight="400">con requisitos y canales.</text><rect x="1368" y="928" width="386" height="188" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1384" y="959.0" font-size="23" fill="#14344A" font-weight="400">Esperado: mantener el control de</text><text x="1384" y="987.75" font-size="23" fill="#14344A" font-weight="400">su decisión. Propuesto:</text><text x="1384" y="1016.5" font-size="23" fill="#14344A" font-weight="400">pendientes guardados y</text><text x="1384" y="1045.25" font-size="23" fill="#14344A" font-weight="400">continuidad sin prometer un</text><text x="1384" y="1074.0" font-size="23" fill="#14344A" font-weight="400">resultado.</text><text x="22" y="1162.0" font-size="17" fill="#087E8B" font-weight="700">BARRERAS</text><rect x="180" y="1132" width="386" height="155" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="196" y="1163.0" font-size="23" fill="#14344A" font-weight="400">Temor a perder dinero; lenguaje</text><text x="196" y="1191.75" font-size="23" fill="#14344A" font-weight="400">desconocido; no puede pagar</text><text x="196" y="1220.5" font-size="23" fill="#14344A" font-weight="400">abogado.</text><rect x="576" y="1132" width="386" height="155" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="592" y="1163.0" font-size="23" fill="#14344A" font-weight="400">Datos incompletos y riesgo de</text><text x="592" y="1191.75" font-size="23" fill="#14344A" font-weight="400">interpretar una respuesta como</text><text x="592" y="1220.5" font-size="23" fill="#14344A" font-weight="400">confirmación del monto.</text><rect x="972" y="1132" width="386" height="155" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="988" y="1163.0" font-size="23" fill="#14344A" font-weight="400">Confundir «orientar» con «firmar»;</text><text x="988" y="1191.75" font-size="23" fill="#14344A" font-weight="400">cambio de portal y requisitos de</text><text x="988" y="1220.5" font-size="23" fill="#14344A" font-weight="400">atención.</text><rect x="1368" y="1132" width="386" height="155" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1384" y="1163.0" font-size="23" fill="#14344A" font-weight="400">Respuesta oficial todavía</text><text x="1384" y="1191.75" font-size="23" fill="#14344A" font-weight="400">pendiente; riesgo de perder</text><text x="1384" y="1220.5" font-size="23" fill="#14344A" font-weight="400">antecedentes.</text><text x="22" y="1333.0" font-size="17" fill="#087E8B" font-weight="700">OPORTUNIDADES</text><rect x="180" y="1303" width="386" height="194" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="196" y="1334.0" font-size="23" fill="#14344A" font-weight="400">Entrada visible «Entender mi</text><text x="196" y="1362.75" font-size="23" fill="#14344A" font-weight="400">finiquito»; consulta inicial gratuita</text><text x="196" y="1391.5" font-size="23" fill="#14344A" font-weight="400">sin cuenta.</text><rect x="576" y="1303" width="386" height="194" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="592" y="1334.0" font-size="23" fill="#14344A" font-weight="400">Glosario en contexto; evidencia</text><text x="592" y="1362.75" font-size="23" fill="#14344A" font-weight="400">por afirmación; indicar lo que no</text><text x="592" y="1391.5" font-size="23" fill="#14344A" font-weight="400">se puede verificar.</text><rect x="972" y="1303" width="386" height="194" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="988" y="1334.0" font-size="23" fill="#14344A" font-weight="400">Acción principal «Preparar</text><text x="988" y="1362.75" font-size="23" fill="#14344A" font-weight="400">consulta»; canal humano junto a</text><text x="988" y="1391.5" font-size="23" fill="#14344A" font-weight="400">la respuesta, antes de cualquier</text><text x="988" y="1420.25" font-size="23" fill="#14344A" font-weight="400">firma.</text><rect x="1368" y="1303" width="386" height="194" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1384" y="1334.0" font-size="23" fill="#14344A" font-weight="400">Resumen descargable opcional;</text><text x="1384" y="1362.75" font-size="23" fill="#14344A" font-weight="400">lista editable de dudas y</text><text x="1384" y="1391.5" font-size="23" fill="#14344A" font-weight="400">pendientes.</text><text x="40" y="1540.0" font-size="22" fill="#14344A" font-weight="400">Lectura: el alivio final expresa una expectativa de control; no garantiza pago, aprobación ni resolución favorable.</text><text x="40" y="1577.0" font-size="20" fill="#14344A" font-weight="400">Adaptación de la plantilla del docente: acciones, emociones, valor, barreras, oportunidades y momento clave.</text></svg>