<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1620" viewBox="0 0 1800 1620" role="img"><title>Entender su jornada y conocer una ruta informada y discreta para pedir orientación.</title><style>text {font-family: Liberation Sans, Arial, sans-serif;}</style><rect x="0" y="0" width="1800" height="1620" rx="0" fill="#F7FAFB" stroke="none"/><rect x="0" y="0" width="1800" height="163" rx="0" fill="#14344A" stroke="none"/><text x="40" y="48.0" font-size="36" fill="#FFFFFF" font-weight="700">Customer Journey · William</text><text x="40" y="83.0" font-size="24" fill="#CDE6EE" font-weight="400">51 años · Conductor de transporte de carga · Temuco · Horas que considera impagas</text><text x="40" y="120.0" font-size="26" fill="#FFFFFF" font-weight="400">Entender su jornada y conocer una ruta informada y discreta para pedir orientación.</text><text x="40" y="150.0" font-size="18" fill="#CDE6EE" font-weight="400">RECORRIDO PROPUESTO · HIPÓTESIS PARA VALIDAR · 05 OCT 2026</text><text x="30" y="198.0" font-size="19" fill="#087E8B" font-weight="700">EMOCIONES</text><text x="30" y="237.0" font-size="18" fill="#14344A" font-weight="400">Satisfacción</text><text x="30" y="413.0" font-size="18" fill="#14344A" font-weight="400">Frustración</text><text x="180" y="188.0" font-size="19" fill="#14344A" font-weight="400">Escala cualitativa: −2 a +2; posiciones estimadas, sin medición de usuarios.</text><line x1="180" y1="402" x2="1760" y2="402" stroke="#D4E0E6" stroke-dasharray="5 6"/><line x1="180" y1="362" x2="1760" y2="362" stroke="#D4E0E6" stroke-dasharray="5 6"/><line x1="180" y1="322" x2="1760" y2="322" stroke="#D4E0E6" stroke-dasharray="5 6"/><line x1="180" y1="282" x2="1760" y2="282" stroke="#D4E0E6" stroke-dasharray="5 6"/><line x1="180" y1="242" x2="1760" y2="242" stroke="#D4E0E6" stroke-dasharray="5 6"/><polyline points="278,362 476,402 674,362 872,402 1070,322 1268,362 1466,322 1664,282" fill="none" stroke="#087E8B" stroke-width="5"/><circle cx="278" cy="362" r="10" fill="#087E8B"/><text x="193" y="340.0" font-size="19" fill="#14344A" font-weight="700">Inquietud</text><circle cx="476" cy="402" r="10" fill="#087E8B"/><text x="391" y="380.0" font-size="19" fill="#14344A" font-weight="700">Desconfianza</text><circle cx="674" cy="362" r="10" fill="#087E8B"/><text x="589" y="340.0" font-size="19" fill="#14344A" font-weight="700">Cautela</text><circle cx="872" cy="402" r="10" fill="#087E8B"/><text x="787" y="380.0" font-size="19" fill="#14344A" font-weight="700">Frustración</text><circle cx="1070" cy="322" r="10" fill="#087E8B"/><text x="985" y="300.0" font-size="19" fill="#14344A" font-weight="700">Claridad parcial</text><circle cx="1268" cy="362" r="10" fill="#087E8B"/><text x="1183" y="340.0" font-size="19" fill="#14344A" font-weight="700">Temor</text><circle cx="1466" cy="322" r="10" fill="#087E8B"/><text x="1381" y="300.0" font-size="19" fill="#14344A" font-weight="700">Apoyo</text><circle cx="1664" cy="282" r="10" fill="#087E8B"/><text x="1579" y="260.0" font-size="19" fill="#14344A" font-weight="700">Control</text><circle cx="674" cy="362" r="19" fill="none" stroke="#AF492C" stroke-width="4"/><text x="180" y="445.0" font-size="22" fill="#AF492C" font-weight="700">Momento clave: clasificar el régimen de jornada antes de interpretar las horas impagas.</text><text x="30" y="490.0" font-size="19" fill="#087E8B" font-weight="700">ACCIONES Y</text><text x="30" y="516.0" font-size="19" fill="#087E8B" font-weight="700">CONTACTOS</text><rect x="180" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="190" y="489.0" font-size="21" fill="#14344A" font-weight="700">1. Detectar</text><text x="190" y="515.25" font-size="21" fill="#14344A" font-weight="700">diferencias</text><text x="190" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Liquidaciones ·</text><text x="190" y="591.75" font-size="19" fill="#087E8B" font-weight="400">contrato · registros</text><text x="190" y="679.0" font-size="20" fill="#14344A" font-weight="400">Compara pagos,</text><text x="190" y="704.0" font-size="20" fill="#14344A" font-weight="400">contrato y</text><text x="190" y="729.0" font-size="20" fill="#14344A" font-weight="400">registros de sus</text><text x="190" y="754.0" font-size="20" fill="#14344A" font-weight="400">actividades.</text><rect x="378" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="388" y="489.0" font-size="21" fill="#14344A" font-weight="700">2. Buscar sin</text><text x="388" y="515.25" font-size="21" fill="#14344A" font-weight="700">exponerse</text><text x="388" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Buscador · celular ·</text><text x="388" y="591.75" font-size="19" fill="#087E8B" font-weight="400">opción «Jornada y</text><text x="388" y="615.5" font-size="19" fill="#087E8B" font-weight="400">pagos»</text><text x="388" y="679.0" font-size="20" fill="#14344A" font-weight="400">Busca orientación</text><text x="388" y="704.0" font-size="20" fill="#14344A" font-weight="400">y entra sin registro</text><text x="388" y="729.0" font-size="20" fill="#14344A" font-weight="400">inicial.</text><rect x="576" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="586" y="489.0" font-size="21" fill="#14344A" font-weight="700">3. Aclarar el</text><text x="586" y="515.25" font-size="21" fill="#14344A" font-weight="700">trabajo</text><text x="586" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Asistente ·</text><text x="586" y="591.75" font-size="19" fill="#087E8B" font-weight="400">preguntas de</text><text x="586" y="615.5" font-size="19" fill="#087E8B" font-weight="400">contexto</text><text x="586" y="679.0" font-size="20" fill="#14344A" font-weight="400">Aclara tipo de</text><text x="586" y="704.0" font-size="20" fill="#14344A" font-weight="400">transporte, jornada</text><text x="586" y="729.0" font-size="20" fill="#14344A" font-weight="400">y registros</text><text x="586" y="754.0" font-size="20" fill="#14344A" font-weight="400">disponibles.</text><rect x="774" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="784" y="489.0" font-size="21" fill="#14344A" font-weight="700">4. Revisar la</text><text x="784" y="515.25" font-size="21" fill="#14344A" font-weight="700">evidencia</text><text x="784" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Respuesta ·</text><text x="784" y="591.75" font-size="19" fill="#087E8B" font-weight="400">consulta oficial DT</text><text x="784" y="679.0" font-size="20" fill="#14344A" font-weight="400">Abre la fuente;</text><text x="784" y="704.0" font-size="20" fill="#14344A" font-weight="400">reconoce lo que</text><text x="784" y="729.0" font-size="20" fill="#14344A" font-weight="400">falta para clasificar</text><text x="784" y="754.0" font-size="20" fill="#14344A" font-weight="400">su jornada.</text><rect x="972" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="982" y="489.0" font-size="21" fill="#14344A" font-weight="700">5. Organizar</text><text x="982" y="515.25" font-size="21" fill="#14344A" font-weight="700">antecedentes</text><text x="982" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Lista local ·</text><text x="982" y="591.75" font-size="19" fill="#087E8B" font-weight="400">resumen de</text><text x="982" y="615.5" font-size="19" fill="#087E8B" font-weight="400">consulta</text><text x="982" y="679.0" font-size="20" fill="#14344A" font-weight="400">Reúne</text><text x="982" y="704.0" font-size="20" fill="#14344A" font-weight="400">antecedentes y</text><text x="982" y="729.0" font-size="20" fill="#14344A" font-weight="400">preguntas para</text><text x="982" y="754.0" font-size="20" fill="#14344A" font-weight="400">una consulta</text><text x="982" y="779.0" font-size="20" fill="#14344A" font-weight="400">humana.</text><rect x="1170" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1180" y="489.0" font-size="21" fill="#14344A" font-weight="700">6. Evaluar los</text><text x="1180" y="515.25" font-size="21" fill="#14344A" font-weight="700">canales</text><text x="1180" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Derivación DT ·</text><text x="1180" y="591.75" font-size="19" fill="#087E8B" font-weight="400">información de</text><text x="1180" y="615.5" font-size="19" fill="#087E8B" font-weight="400">privacidad</text><text x="1180" y="679.0" font-size="20" fill="#14344A" font-weight="400">Revisa los datos</text><text x="1180" y="704.0" font-size="20" fill="#14344A" font-weight="400">requeridos y elige</text><text x="1180" y="729.0" font-size="20" fill="#14344A" font-weight="400">el canal oficial.</text><rect x="1368" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1378" y="489.0" font-size="21" fill="#14344A" font-weight="700">7. Consultar a la</text><text x="1378" y="515.25" font-size="21" fill="#14344A" font-weight="700">DT</text><text x="1378" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Teléfono, oficina o</text><text x="1378" y="591.75" font-size="19" fill="#087E8B" font-weight="400">portal oficial</text><text x="1378" y="679.0" font-size="20" fill="#14344A" font-weight="400">Pide orientación y</text><text x="1378" y="704.0" font-size="20" fill="#14344A" font-weight="400">decide si inicia</text><text x="1378" y="729.0" font-size="20" fill="#14344A" font-weight="400">una gestión oficial.</text><rect x="1566" y="465" width="188" height="375" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1576" y="489.0" font-size="21" fill="#14344A" font-weight="700">8. Seguir lo</text><text x="1576" y="515.25" font-size="21" fill="#14344A" font-weight="700">decidido</text><text x="1576" y="568.0" font-size="19" fill="#087E8B" font-weight="400">Registro propio ·</text><text x="1576" y="591.75" font-size="19" fill="#087E8B" font-weight="400">comprobante oficial</text><text x="1576" y="615.5" font-size="19" fill="#087E8B" font-weight="400">si existe</text><text x="1576" y="679.0" font-size="20" fill="#14344A" font-weight="400">Guarda el</text><text x="1576" y="704.0" font-size="20" fill="#14344A" font-weight="400">comprobante</text><text x="1576" y="729.0" font-size="20" fill="#14344A" font-weight="400">oficial, si existe, y</text><text x="1576" y="754.0" font-size="20" fill="#14344A" font-weight="400">retoma</text><text x="1576" y="779.0" font-size="20" fill="#14344A" font-weight="400">pendientes.</text><rect x="180" y="856" width="386" height="56" rx="6" fill="#087E8B" stroke="none"/><text x="192" y="891.0" font-size="23" fill="#FFFFFF" font-weight="700">Búsqueda de orientación</text><rect x="576" y="856" width="386" height="56" rx="6" fill="#087E8B" stroke="none"/><text x="588" y="891.0" font-size="23" fill="#FFFFFF" font-weight="700">Comprensión y verificación</text><rect x="972" y="856" width="386" height="56" rx="6" fill="#087E8B" stroke="none"/><text x="984" y="891.0" font-size="23" fill="#FFFFFF" font-weight="700">Decisión y derivación</text><rect x="1368" y="856" width="386" height="56" rx="6" fill="#087E8B" stroke="none"/><text x="1380" y="891.0" font-size="23" fill="#FFFFFF" font-weight="700">Continuidad del caso</text><text x="22" y="958.0" font-size="17" fill="#087E8B" font-weight="700">VALOR</text><rect x="180" y="928" width="386" height="188" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="196" y="959.0" font-size="23" fill="#14344A" font-weight="400">Esperado: información confiable y</text><text x="196" y="987.75" font-size="23" fill="#14344A" font-weight="400">discreción. Propuesto: consultar</text><text x="196" y="1016.5" font-size="23" fill="#14344A" font-weight="400">sin cuenta y explicar el</text><text x="196" y="1045.25" font-size="23" fill="#14344A" font-weight="400">tratamiento de datos.</text><rect x="576" y="928" width="386" height="188" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="592" y="959.0" font-size="23" fill="#14344A" font-weight="400">Esperado: una regla pertinente a</text><text x="592" y="987.75" font-size="23" fill="#14344A" font-weight="400">su trabajo. Propuesto:</text><text x="592" y="1016.5" font-size="23" fill="#14344A" font-weight="400">clasificación previa y límites</text><text x="592" y="1045.25" font-size="23" fill="#14344A" font-weight="400">visibles si faltan datos.</text><rect x="972" y="928" width="386" height="188" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="988" y="959.0" font-size="23" fill="#14344A" font-weight="400">Esperado: entender cómo pedir</text><text x="988" y="987.75" font-size="23" fill="#14344A" font-weight="400">ayuda. Propuesto: antecedentes</text><text x="988" y="1016.5" font-size="23" fill="#14344A" font-weight="400">organizados y canales oficiales</text><text x="988" y="1045.25" font-size="23" fill="#14344A" font-weight="400">con sus requisitos.</text><rect x="1368" y="928" width="386" height="188" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1384" y="959.0" font-size="23" fill="#14344A" font-weight="400">Esperado: continuidad y control.</text><text x="1384" y="987.75" font-size="23" fill="#14344A" font-weight="400">Propuesto: pendientes y</text><text x="1384" y="1016.5" font-size="23" fill="#14344A" font-weight="400">recordatorio de guardar</text><text x="1384" y="1045.25" font-size="23" fill="#14344A" font-weight="400">comprobantes del canal oficial.</text><text x="22" y="1162.0" font-size="17" fill="#087E8B" font-weight="700">BARRERAS</text><rect x="180" y="1132" width="386" height="155" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="196" y="1163.0" font-size="23" fill="#14344A" font-weight="400">Temor a represalias; fuentes</text><text x="196" y="1191.75" font-size="23" fill="#14344A" font-weight="400">contradictorias y registros</text><text x="196" y="1220.5" font-size="23" fill="#14344A" font-weight="400">dispersos.</text><rect x="576" y="1132" width="386" height="155" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="592" y="1163.0" font-size="23" fill="#14344A" font-weight="400">El tipo de transporte y la jornada</text><text x="592" y="1191.75" font-size="23" fill="#14344A" font-weight="400">no están definidos en la persona</text><text x="592" y="1220.5" font-size="23" fill="#14344A" font-weight="400">UX.</text><rect x="972" y="1132" width="386" height="155" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="988" y="1163.0" font-size="23" fill="#14344A" font-weight="400">Confundir confidencialidad con</text><text x="988" y="1191.75" font-size="23" fill="#14344A" font-weight="400">anonimato; temor al entregar</text><text x="988" y="1220.5" font-size="23" fill="#14344A" font-weight="400">datos en otro portal.</text><rect x="1368" y="1132" width="386" height="155" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1384" y="1163.0" font-size="23" fill="#14344A" font-weight="400">Esperas de atención; pérdida de</text><text x="1384" y="1191.75" font-size="23" fill="#14344A" font-weight="400">registros y confusión entre</text><text x="1384" y="1220.5" font-size="23" fill="#14344A" font-weight="400">orientación y trámite.</text><text x="22" y="1333.0" font-size="17" fill="#087E8B" font-weight="700">OPORTUNIDADES</text><rect x="180" y="1303" width="386" height="194" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="196" y="1334.0" font-size="23" fill="#14344A" font-weight="400">Consulta inicial sin identificación;</text><text x="196" y="1362.75" font-size="23" fill="#14344A" font-weight="400">aviso claro de privacidad antes de</text><text x="196" y="1391.5" font-size="23" fill="#14344A" font-weight="400">pedir datos.</text><rect x="576" y="1303" width="386" height="194" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="592" y="1334.0" font-size="23" fill="#14344A" font-weight="400">Preguntas cortas sobre régimen;</text><text x="592" y="1362.75" font-size="23" fill="#14344A" font-weight="400">no ofrecer una calculadora</text><text x="592" y="1391.5" font-size="23" fill="#14344A" font-weight="400">universal de horas extra.</text><rect x="972" y="1303" width="386" height="194" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="988" y="1334.0" font-size="23" fill="#14344A" font-weight="400">Mostrar destino, requisitos y</text><text x="988" y="1362.75" font-size="23" fill="#14344A" font-weight="400">alcance de confidencialidad</text><text x="988" y="1391.5" font-size="23" fill="#14344A" font-weight="400">publicado; no enviar</text><text x="988" y="1420.25" font-size="23" fill="#14344A" font-weight="400">automáticamente.</text><rect x="1368" y="1303" width="386" height="194" rx="8" fill="#FFFFFF" stroke="#D4E0E6"/><text x="1384" y="1334.0" font-size="23" fill="#14344A" font-weight="400">Separar resumen del asistente de</text><text x="1384" y="1362.75" font-size="23" fill="#14344A" font-weight="400">comprobantes oficiales; guardar</text><text x="1384" y="1391.5" font-size="23" fill="#14344A" font-weight="400">solo a petición del usuario.</text><text x="40" y="1540.0" font-size="22" fill="#14344A" font-weight="400">Lectura: el alivio final expresa una expectativa de control; no garantiza pago, aprobación ni resolución favorable.</text><text x="40" y="1577.0" font-size="20" fill="#14344A" font-weight="400">Adaptación de la plantilla del docente: acciones, emociones, valor, barreras, oportunidades y momento clave.</text></svg>